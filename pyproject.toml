[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent"
version = "0.0.0"
description = "RAG (Retrieval-Augmented Generation) pipeline implementation"
requires-python = ">=3.12"
authors = [
    { name="Dawid Ciepiela", email="71898979+sarumaj@users.noreply.github.com" }
]
readme = "README.md"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "aiohttp==3.14.3",
    "asyncio==3.4.3",
    "beautifulsoup4==4.15.0",
    "langchain==1.4.9",
    "langchain-chroma==1.1.0",
    "langchain-community==0.4.2",
    "langchain-core==1.7.7",
    "langchain-huggingface[full]==1.2.3",
    "langchain-ollama==1.1.0",
    "langchain-text-splitters==1.1.3",
    "langgraph==1.2.20",
    "nest-asyncio==1.6.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "tqdm==4.70.1"
]

[project.scripts]
rag-agent-ui = "rag_agent.ui.__main__:main"
rag-agent-pipeline = "rag_agent.pipeline.__main__:main"
rag-agent-scraper-ix = "rag_agent.scrapers.ix.__main__:main"
rag-agent-pdf-merge = "rag_agent.utils.merge.__main__:main"

[project.optional-dependencies]
loaders  = [
    "pymupdf==1.28.2",
    "unstructured==0.24.0"
]
scraper = [
    "selenium==4.53.0",
    "webdriver_manager==4.1.2"
]
test = [
    "pytest==9.2.0",
    "pytest-asyncio==1.5.0"
]
ui = [
    "panel==1.10.0",
    "Pygments==2.19.1"
]

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["tests*"]

[tool.pytest.ini_options]
pythonpath = ["src/rag_agent"]
testpaths = ["tests"]
addopts = [
    "-v",
    "--asyncio-mode=auto"
]
