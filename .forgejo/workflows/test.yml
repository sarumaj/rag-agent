# The tests of every change: pushes to main and to renovate/all-patch, where Renovate's
# patches merge from once this passes (no ignoreTests in renovate.json), and pull requests.
name: Test
# A failed job mails whoever started the run. Renovate's bot has no mailbox: when its
# branch fails, Renovate opens a pull request, which mails the repository's watchers.
enable-email-notifications: true
'on':
  push:
    branches:
    - main
    - renovate/all-patch
  pull_request: null
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: https://github.com/actions/checkout@v4
    - name: Set up Python
      uses: https://github.com/actions/setup-python@v5
      # Below 3.14, which unstructured (the extra loaders) does not support yet: renovate.json
      # keeps Renovate from raising it further.
      with:
        python-version: '3.12'
    - name: Cache pip packages
      uses: https://github.com/actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test,loaders,scraper]
    # As JUnit too, for the report below.
    - name: Run tests
      id: tests
      run: pytest --junitxml=/tmp/pytest.xml
    # The results as one comment on the pull request (dawid/ci-actions), also when
    # tests failed.
    - name: Test report
      if: always() && steps.tests.outcome != 'skipped'
      uses: https://git.ciepiela.org/dawid/ci-actions/test-report@main
      with:
        junit: /tmp/pytest.xml
